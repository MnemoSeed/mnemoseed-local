[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemoseed-local"
version = "0.0.1"
description = "Local single-user memory daemon for coding agents — capture, dream, decay, retrieve"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    # embedded vector layer: lancedb chunks table + hybrid search.
    # Pinned to the production-proven line: 0.37+ moved `.metric` off the
    # base query-builder type surface, breaking the mypy gate.
    "lancedb==0.36.0",
    # bge-m3 embedder: CPU inference + XLM-RoBERTa tokenization
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    # vector math shared by the vector/embed drivers (synthetic, bge-m3, lancedb)
    "numpy>=2.0",
    # OS keychain custody: Windows Credential Manager / macOS Keychain /
    # Linux libsecret. Probe-detected: the chain falls back to the
    # restricted-file backend when no keyring answers.
    "keyring>=25",
    # daemon surface: FastAPI app + uvicorn runner (the A2 daemon ships the
    # capture/recall/dream/config HTTP endpoints; localhost-only by default).
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mnemoseed-local = "mnemoseed_local.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemoseed_local"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

# third-party libs without type stubs / py.typed markers
[[tool.mypy.overrides]]
module = ["pyarrow", "lancedb", "lancedb.query", "onnxruntime", "keyring"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
