name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Changed comment policy
        run: uv run python scripts/check_changed_comments.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q

  # The cheap static gates read every commit a pull request adds, so a commit cannot
  # hide behind a green tip or a merge. The type check and the suite stay in the
  # `test` job above, where their cost is paid once.
  commit-range-gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Cheap gates on every commit
        run: uv run python scripts/check_commit_range.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  atlas-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.verification-runs/playwright-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Install pinned Chromium
        run: uv run playwright install --with-deps chromium
      - name: Isolation preflight
        run: uv run python scripts/atlas_preflight.py
      - name: Verify Atlas in isolated daemon
        run: uv run python scripts/atlas_verify.py
      - name: Sanitize and retain Atlas evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .atlas-proof .verification-runs
          evidence_count="$(find .verification-runs -name evidence.txt -type f 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$evidence_count" = "1" ]; then
            evidence="$(find .verification-runs -name evidence.txt -type f -print -quit)"
            uv run python scripts/sanitize_atlas_evidence.py "$evidence" "$GITHUB_SHA" > .atlas-proof/evidence.txt
          else
            uv run python scripts/sanitize_atlas_evidence.py .verification-runs/missing-evidence.txt "$GITHUB_SHA" > .atlas-proof/evidence.txt
          fi
          if ! grep -qx 'status=PASS' .atlas-proof/evidence.txt; then
            echo 'Atlas proof is not a validated PASS' >&2
            exit 1
          fi
      - name: Upload Atlas evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-evidence
          path: .atlas-proof/evidence.txt
          if-no-files-found: error
          retention-days: 14

  install-script-smoke:
    # Phase A3 (T1+T4): the zero-dependency install orchestrators must stay
    # syntax-valid and their dry-run must be side-effect-free on every matrix
    # OS (install.sh on Linux and macOS, install.ps1 on Windows).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n install.sh && sh install.sh --dry-run
      - name: Verify the generated systemd unit (syntax)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          if ! command -v systemd-analyze >/dev/null 2>&1; then
            echo "systemd-analyze unavailable; the unit content pins carry the syntax proof"
            exit 0
          fi
          work="$(mktemp -d)"
          sed -n '/^# --- unix autostart: shared generation/,/^# --- unix autostart end ---/p' install.sh > "$work/span.sh"
          printf '#!/bin/sh\nexit 0\n' > "$work/mnemoseed-local"
          chmod +x "$work/mnemoseed-local"
          sh -c "
            die() { printf '%s\n' \"install.sh: error: \$*\" >&2; exit 1; }
            have() { command -v \"\$1\" >/dev/null 2>&1; }
            . '$work/span.sh'
            ( MNEMOSEED_LOCAL_HOME=; emit_systemd_unit '$work/mnemoseed-local' ) > '$work/default.service'
            ( MNEMOSEED_LOCAL_HOME='$work/home'; export MNEMOSEED_LOCAL_HOME; emit_systemd_unit '$work/mnemoseed-local' ) > '$work/override.service'
          "
          systemd-analyze verify "$work/default.service" "$work/override.service"
      - name: Lint the generated LaunchAgent plist (syntax)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          work="$(mktemp -d)"
          sed -n '/^# --- unix autostart: shared generation/,/^# --- unix autostart end ---/p' install.sh > "$work/span.sh"
          printf '#!/bin/sh\nexit 0\n' > "$work/mnemoseed-local"
          chmod +x "$work/mnemoseed-local"
          sh -c "
            die() { printf '%s\n' \"install.sh: error: \$*\" >&2; exit 1; }
            have() { command -v \"\$1\" >/dev/null 2>&1; }
            . '$work/span.sh'
            ( HOME='$work/home'; export HOME; MNEMOSEED_LOCAL_HOME=; emit_launchagent_plist '$work/mnemoseed-local' ) > '$work/default.plist'
            ( HOME='$work/home'; export HOME; MNEMOSEED_LOCAL_HOME='$work/home/data'; export MNEMOSEED_LOCAL_HOME; emit_launchagent_plist '$work/mnemoseed-local' ) > '$work/override.plist'
          "
          plutil -lint "$work/default.plist" "$work/override.plist"
      - name: Dry-run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install.ps1 -DryRun

  release-install-verify:
    # Build the wheel and sdist from the checkout, install the wheel with its
    # codex extra into an isolated uv tool dir, and verify the installed
    # surface on a clean runner. The structured proof uploads even on failure.
    # The macOS leg runs the same runner-level proof; a macOS run is
    # not a real-host or model proof: no Ollama model is pulled and no host
    # trust is granted (the report's coverage limits state this).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Verify the built wheel on a clean runner
        run: uv run --no-project python scripts/verify_release_install.py --report release-proof/verify-release-install.json
      - name: Upload install proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-install-proof-${{ matrix.os }}
          path: release-proof/
          if-no-files-found: warn
          retention-days: 14
